name: Media Conversion

on:
  push:
    paths:
      - "uploads/originals/**"
      - "src/content/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Install dependencies
        run: pnpm install

      - name: Convert source uploads
        run: pnpm media:build

      - name: Check media policy
        run: pnpm media:check

      - name: Commit generated media
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "Optimize uploaded media"
          file_pattern: "public/media uploads/originals src/assets/uploads/originals src/content"
