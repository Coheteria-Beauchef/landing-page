media:
  input: public/media
  output: /media
  rename: random
  extensions: [jpg, jpeg, png, webp]

content:
  - name: news
    label: Noticias
    type: collection
    path: src/content/news
    filename: "{fields.slug}.md"
    fields:
      - { name: title, label: Título, type: string, required: true }
      - { name: slug, label: Slug, type: string, required: true }
      - { name: source, label: Medio, type: string, required: true }
      - { name: url, label: URL, type: string, required: true }
      - { name: date, label: Fecha visible, type: string, required: true }
      - { name: excerpt, label: Bajada, type: text, required: true }
      - { name: imageSrc, label: Imagen, type: image, required: true }
      - { name: order, label: Orden, type: number, required: true }
      - { name: draft, label: Borrador, type: boolean, default: false }
      - { name: body, label: Contenido, type: rich-text }

  - name: projects
    label: Proyectos
    type: collection
    path: src/content/projects
    filename: "{fields.slug}.md"
    fields:
      - { name: title, label: Nombre, type: string, required: true }
      - { name: slug, label: Slug, type: string, required: true }
      - { name: summary, label: Resumen, type: text, required: true }
      - { name: logoSrc, label: Logo, type: image }
      - { name: videoUrl, label: URL de video, type: string }
      - { name: gallery, label: Galería, type: image, list: true }
      - { name: model3dSrc, label: Modelo 3D, type: string }
      - { name: order, label: Orden, type: number, required: true }
      - { name: draft, label: Borrador, type: boolean, default: true }
      - { name: body, label: Detalle, type: rich-text }

  - name: instagram
    label: Instagram
    type: collection
    path: src/content/instagram
    filename: "{fields.order}.md"
    view:
      fields: [imageSrc, imageAlt, postUrl]
      primary: imageAlt
      sort: [order, asc]
    fields:
      - { name: order, label: Orden, type: number, required: true }
      - { name: postUrl, label: URL del post, type: string }
      - { name: excerpt, label: Caption resumido, type: text, required: true }
      - { name: likes, label: Likes, type: number, required: true }
      - { name: comments, label: Comentarios, type: number, required: true }
      - { name: imageSrc, label: Imagen subida por RRSS, type: image, required: true }
      - { name: imageAlt, label: Texto alternativo, type: string, required: true }

  - name: sponsors
    label: Sponsors
    type: collection
    path: src/content/sponsors
    filename:
      field: alt
      slugify: true
      readonly: true
      label: Nombre interno
    view:
      fields: [src, alt]
      primary: alt
      sort: [order, asc]
    fields:
      - { name: order, label: Orden, type: number, required: true }
      - { name: src, label: Logo, type: image, required: true }
      - { name: alt, label: Nombre, type: string, required: true }
      - { name: heightClass, label: Clase de altura, type: string }

  - name: team
    label: Equipo
    type: collection
    path: src/content/team
    filename:
      field: lead.name
      slugify: true
      readonly: true
      label: Nombre interno
    view:
      fields: [kind, lead.name, lead.role]
      primary: lead.name
      sort: [order, asc]
    fields:
      - { name: kind, label: Tipo, type: select, options: ["captain", "area", "support", "professor"], required: true }
      - { name: order, label: Orden, type: number, required: true }
      - name: lead
        label: Encargado
        type: object
        fields:
          - { name: name, label: Nombre, type: string, required: true }
          - { name: role, label: Roles, type: string, list: true, required: true }
          - { name: imageSrc, label: Foto, type: image }
          - { name: imageAlt, label: Texto alternativo, type: string }
      - { name: membersMarkdown, label: Integrantes en Markdown, type: text }
      - { name: description, label: Descripción, type: text }
      - { name: detailsMarkdown, label: Detalle del modal en Markdown, type: text }
      - { name: coverImageSrc, label: Imagen placeholder del equipo, type: image }
      - { name: coverImageAlt, label: Texto alternativo del placeholder, type: string }

  - name: settings
    label: Ajustes del sitio
    type: file
    path: src/content/site/settings.yml
    fields:
      - name: announcement
        label: Anuncio
        type: object
        fields:
          - { name: enabled, label: Activo, type: boolean }
          - { name: text, label: Texto, type: string }
          - { name: href, label: URL, type: string }
      - name: teamPage
        label: Página de equipo
        type: object
        fields:
          - { name: title, label: Título visible, type: string, required: true }
          - { name: seoTitle, label: Título SEO, type: string, required: true }
          - { name: seoDescription, label: Descripción SEO, type: text, required: true }
          - { name: studentOrgTitle, label: Título organigrama estudiantil, type: string, required: true }
          - { name: professorsTitle, label: Título profesores de apoyo, type: string, required: true }
          - { name: workTeamsTitle, label: Título equipos de trabajo, type: string, required: true }
          - { name: defaultImageSrc, label: Imagen por defecto, type: image, required: true }
          - { name: defaultImageAlt, label: Texto alternativo imagen por defecto, type: string, required: true }
          - { name: fallbackDescription, label: Descripción fallback del modal, type: text, required: true }
          - { name: membersHeading, label: Título de integrantes, type: string, required: true }
          - { name: fallbackMember, label: Integrante fallback, type: string, required: true }
          - { name: showCta, label: Mostrar CTA inferior, type: boolean, default: true }
